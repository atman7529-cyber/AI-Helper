
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Helper - مساعدك الذكي</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 25px 15px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }
    h1 { color: #2563eb; }
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: 17px;
      margin-top: 12px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #answer {
      margin-top: 20px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      text-align: right;
      white-space: pre-wrap;
      line-height: 1.7;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Helper 🤖</h1>
    <p>مرحبًا! أنا مساعدك الذكي. اكتب سؤالك وسأجيبك.</p>

    <textarea id="message" placeholder="اكتب سؤالك هنا..."></textarea>
    <br>
    <button id="send" onclick="askAI()">إرسال السؤال</button>

    <div id="answer">ستظهر الإجابة هنا...</div>
  </div>

  <script>
    async function askAI() {
      const message = document.getElementById("message").value.trim();
      const answer = document.getElementById("answer");
      const button = document.getElementById("send");

      if (!message) {
        answer.textContent = "اكتب سؤالك أولًا.";
        return;
      }

      button.disabled = true;
      answer.textContent = "جاري التفكير...";

      try {
        const response = await fetch(
          "https://billowing-bar-9805.atman7529.workers.dev",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ في الاتصال.");
        }

        answer.textContent = data.text || "لم تصل إجابة.";
      } catch (error) {
        answer.textContent = "تعذر الاتصال: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
